name: Release builds

on:
  release:
    types: [published]

jobs:
  test:
    name: Tests and coverage gate
    uses: ./.github/workflows/test.yml

  android:
    name: Build Android APKs
    needs: test
    permissions:
      contents: write
    uses: ./.github/workflows/release-build-android.yml
    secrets: inherit

  linux:
    name: Build Linux AppImage
    needs: test
    permissions:
      contents: write
    uses: ./.github/workflows/release-build-linux.yml
    secrets: inherit

  windows:
    name: Build Windows installer
    needs: test
    permissions:
      contents: write
    uses: ./.github/workflows/release-build-windows.yml
    secrets: inherit
