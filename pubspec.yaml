name: pocket2fa
description: 2FA manager based on 2FAuth web app.
publish_to: 'none'

version: 0.10.0+31

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: "3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.5.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  dio: ^5.11.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  flutter_svg: ^2.3.0
  crypto: ^3.0.7
  url_launcher: ^6.3.3
  flutter_zxing: ^3.1.0
  image_picker: ^1.2.4
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2
  image: ^4.12.0
  window_manager: ^0.5.2
  # window_manager 0.5.2 still depends on screen_retriever ^0.2.2.
  screen_retriever: ^0.2.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon.png
